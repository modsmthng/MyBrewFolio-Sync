name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:fake-gaggimate

  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: cargo fmt --check
        working-directory: src-tauri

      - run: cargo check --locked
        working-directory: src-tauri

      - run: cargo test --locked --lib
        working-directory: src-tauri

      - name: Verify Microsoft Store packaging sources
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts/*.ps1,windows/test-package/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($_.FullName): $($errors -join '; ')"
            }
          }
          [xml]$manifest = Get-Content windows/Package.appxmanifest.xml -Raw
          $namespace = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $namespace.AddNamespace('f', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $dependency = $manifest.SelectSingleNode("/f:Package/f:Dependencies/f:PackageDependency[@Name='Microsoft.VCLibs.140.00.UWPDesktop']", $namespace)
          if (-not $dependency) {
            throw 'Microsoft.VCLibs.140.00.UWPDesktop is missing from the Store manifest'
          }
          $installScript = Get-Content windows/test-package/Install-TestPackage.ps1 -Raw
          $uninstallScript = Get-Content windows/test-package/Uninstall-TestPackage.ps1 -Raw
          if ($installScript -match 'CurrentUser\\TrustedPeople') {
            throw 'The MSIX test installer must not trust certificates for only the current user'
          }
          if ($installScript -notmatch 'LocalMachine\\TrustedPeople') {
            throw 'The MSIX test installer must use Local Computer > Trusted People'
          }
          if ($installScript -notmatch 'Get-AuthenticodeSignature') {
            throw 'The MSIX test installer must verify the package signer before installation'
          }
          if ($uninstallScript -notmatch 'LocalMachine\\TrustedPeople') {
            throw 'The MSIX test uninstaller must remove the machine-wide test certificate'
          }

  sonarqube:
    name: SonarQube Cloud
    needs:
      - fixtures
      - native-check

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
