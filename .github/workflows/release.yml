name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release build dry run' || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          VERSION="$(node scripts/ha-release.mjs version "$RELEASE_TAG")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  home-assistant-validation:
    needs: versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build:ha
      - run: npm run test:ha
      - run: npm run test:ha-release
      - run: cargo test --locked --no-default-features --features headless-web
        working-directory: src-tauri

  home-assistant:
    needs: [versions, home-assistant-validation]
    if: github.repository == 'modsmthng/MyBrewFolio-Sync'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    env:
      IMAGE: ghcr.io/modsmthng/mybrewfolio-sync-ha
      VERSION: ${{ needs.versions.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify OAuth configuration
        env:
          OAUTH_CLIENT_ID: ${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
        run: test -n "$OAUTH_CLIENT_ID"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse previously tested immutable architecture image
        id: existing
        if: github.event_name == 'push'
        run: |
          if docker manifest inspect "$IMAGE:$VERSION-$ARCH-$GITHUB_SHA" >/dev/null 2>&1; then
            docker pull --platform "$PLATFORM" "$IMAGE:$VERSION-$ARCH-$GITHUB_SHA"
            docker tag "$IMAGE:$VERSION-$ARCH-$GITHUB_SHA" mybrewfolio-sync-ha:test
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.reuse != 'true'
        with:
          context: .
          target: home-assistant
          provenance: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: mybrewfolio-sync-ha:test
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.versions.outputs.version }}
            io.hass.version=${{ needs.versions.outputs.version }}
            io.hass.arch=${{ matrix.arch == 'arm64' && 'aarch64' || 'amd64' }}
          build-args: |
            MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID=${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
      - name: Test the HA image on its target architecture
        run: |
          test "$(docker inspect mybrewfolio-sync-ha:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          node tests/verify-ha-container.mjs mybrewfolio-sync-ha:test
      - name: Publish tested architecture and record evidence
        if: github.event_name == 'push'
        run: |
          REF="$IMAGE:$VERSION-$ARCH-$GITHUB_SHA"
          if [ '${{ steps.existing.outputs.reuse }}' != true ]; then
            docker tag mybrewfolio-sync-ha:test "$REF"
            docker push "$REF"
          fi
          DIGEST="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
          node scripts/ha-release.mjs test-evidence "$PLATFORM" "$GITHUB_SHA" "$DIGEST" "ha-test-$ARCH.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: ha-test-${{ matrix.arch }}
          path: ha-test-*.json
          if-no-files-found: error

  home-assistant-manifest:
    needs: [versions, home-assistant, release]
    if: github.repository == 'modsmthng/MyBrewFolio-Sync' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/modsmthng/mybrewfolio-sync-ha
      VERSION: ${{ needs.versions.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: ha-test-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable multi-architecture image
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > existing-manifest.json 2> inspect-error.txt; then
            echo 'Verifying the existing immutable version'
          elif grep -Eq 'manifest unknown|no such manifest' inspect-error.txt; then
            AMD64_DIGEST="$(node -p "require('./ha-test-amd64.json').digest")"
            ARM64_DIGEST="$(node -p "require('./ha-test-arm64.json').digest")"
            docker buildx imagetools create --tag "$IMAGE:$VERSION" \
              "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
          else
            cat inspect-error.txt >&2
            exit 1
          fi
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > image-manifest.json
          node scripts/ha-release.mjs receipt "$VERSION" "$GITHUB_SHA" "$DIGEST" home-assistant-build.json ha-test-amd64.json ha-test-arm64.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {validateReceipt} from "./scripts/ha-release.mjs"; validateReceipt(JSON.parse(readFileSync("home-assistant-build.json")),process.env.VERSION,process.env.GITHUB_SHA,JSON.parse(readFileSync("image-manifest.json")));'
      - name: Attach the verified receipt to the release
        run: |
          if gh release download "$GITHUB_REF_NAME" --pattern home-assistant-build.json --dir previous-receipt; then
            cmp previous-receipt/home-assistant-build.json home-assistant-build.json
          else
            gh release upload "$GITHUB_REF_NAME" home-assistant-build.json
          fi

  container:
    needs: versions
    if: github.repository == 'modsmthng/MyBrewFolio-Sync'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify container OAuth configuration
        env:
          OAUTH_CLIENT_ID: ${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
        run: |
          test -n "$OAUTH_CLIENT_ID" || { echo 'Missing MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID repository variable'; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/modsmthng/mybrewfolio-sync:${{ github.event_name == 'push' && github.ref_name || github.sha }}
            ghcr.io/modsmthng/mybrewfolio-sync:latest
          build-args: |
            MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID=${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}

  release:
    needs: versions
    if: github.repository == 'modsmthng/MyBrewFolio-Sync'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: '--bundles appimage,deb'
          - os: windows-latest
            args: '--bundles msi'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify release configuration
        shell: bash
        env:
          OAUTH_CLIENT_ID: ${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
          UPDATER_PUBLIC_KEY: ${{ vars.MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$OAUTH_CLIENT_ID" || { echo 'Missing MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID repository variable'; exit 1; }
          test -n "$UPDATER_PUBLIC_KEY" || { echo 'Missing MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY repository variable'; exit 1; }
          test -n "$UPDATER_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret'; exit 1; }
          test -n "$UPDATER_PRIVATE_KEY_PASSWORD" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret'; exit 1; }
          printf '%s' "$UPDATER_PUBLIC_KEY" | base64 --decode | grep -q '^untrusted comment: minisign public key:' || {
            echo 'MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY is not a complete Tauri updater public key'
            exit 1
          }
          CONFIG_PUBLIC_KEY="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          test "$UPDATER_PUBLIC_KEY" = "$CONFIG_PUBLIC_KEY" || {
            echo 'The repository updater key does not match src-tauri/tauri.conf.json'
            exit 1
          }
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(awk -F'\"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"
          EXPECTED_VERSION="$PACKAGE_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
            test "$EXPECTED_VERSION" = "$PACKAGE_VERSION" || { echo 'The release tag does not match package.json'; exit 1; }
          fi
          test "$EXPECTED_VERSION" = "$TAURI_VERSION" || { echo 'The release version does not match tauri.conf.json'; exit 1; }
          test "$EXPECTED_VERSION" = "$CARGO_VERSION" || { echo 'The release version does not match Cargo.toml'; exit 1; }
      - uses: tauri-apps/tauri-action@v1
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID: ${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
          MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY: ${{ vars.MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'MyBrewFolio Sync __VERSION__'
          releaseBody: 'Profile selection and favorites can be applied independently. Installation reports when the GaggiMate favorite limit is reached.'
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}
      - name: Build release artifacts without creating a release
        if: github.event_name == 'workflow_dispatch'
        env:
          MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID: ${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
          MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY: ${{ vars.MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Verify packaged desktop entrypoint
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "${{ matrix.os }}" in
            macos-latest)
              APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/MyBrewFolio Sync.app"
              test "$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")" = "mybrewfolio-sync"
              test -x "$APP/Contents/MacOS/mybrewfolio-sync"
              ;;
            ubuntu-22.04)
              DEB="src-tauri/target/release/bundle/deb/MyBrewFolio Sync_${PACKAGE_VERSION}_amd64.deb"
              CHECK_DIR="$(mktemp -d)"
              dpkg-deb -x "$DEB" "$CHECK_DIR"
              test -x "$CHECK_DIR/usr/bin/mybrewfolio-sync"
              DESKTOP_FILE="$(find "$CHECK_DIR" -type f -name '*.desktop' -print -quit)"
              test -n "$DESKTOP_FILE"
              grep -qx 'Exec=mybrewfolio-sync' "$DESKTOP_FILE"
              ;;
            windows-latest)
              test -f "src-tauri/target/release/mybrewfolio-sync.exe"
              ;;
          esac
      - name: Upload stable user-facing download aliases
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ matrix.os }}" in
            macos-latest)
              cp "src-tauri/target/universal-apple-darwin/release/bundle/dmg/MyBrewFolio Sync_${GITHUB_REF_NAME#v}_universal.dmg" \
                "MyBrewFolio-Sync-macOS-universal.dmg"
              gh release upload "$GITHUB_REF_NAME" "MyBrewFolio-Sync-macOS-universal.dmg" --clobber
              ;;
            windows-latest)
              cp "src-tauri/target/release/bundle/msi/MyBrewFolio Sync_${GITHUB_REF_NAME#v}_x64_en-US.msi" \
                "MyBrewFolio-Sync-Windows-x64.msi"
              gh release upload "$GITHUB_REF_NAME" "MyBrewFolio-Sync-Windows-x64.msi" --clobber
              ;;
            ubuntu-22.04)
              cp "src-tauri/target/release/bundle/appimage/MyBrewFolio Sync_${GITHUB_REF_NAME#v}_amd64.AppImage" \
                "MyBrewFolio-Sync-Linux-x86_64.AppImage"
              cp "src-tauri/target/release/bundle/deb/MyBrewFolio Sync_${GITHUB_REF_NAME#v}_amd64.deb" \
                "MyBrewFolio-Sync-Linux-amd64.deb"
              gh release upload "$GITHUB_REF_NAME" \
                "MyBrewFolio-Sync-Linux-x86_64.AppImage" \
                "MyBrewFolio-Sync-Linux-amd64.deb" \
                --clobber
              ;;
          esac
      - name: Upload Linux dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload Windows dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Upload macOS dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
