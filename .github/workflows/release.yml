name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  container:
    if: github.repository == 'modsmthng/MyBrewFolio-Sync'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify container OAuth configuration
        env:
          OAUTH_CLIENT_ID: ${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
        run: |
          test -n "$OAUTH_CLIENT_ID" || { echo 'Missing MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID repository variable'; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/modsmthng/mybrewfolio-sync:${{ github.ref_name }}
            ghcr.io/modsmthng/mybrewfolio-sync:latest
          build-args: |
            MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID=${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}

  release:
    if: github.repository == 'modsmthng/MyBrewFolio-Sync'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: '--bundles appimage,deb'
          - os: windows-latest
            args: '--bundles msi'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify release configuration
        shell: bash
        env:
          OAUTH_CLIENT_ID: ${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
          UPDATER_PUBLIC_KEY: ${{ vars.MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$OAUTH_CLIENT_ID" || { echo 'Missing MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID repository variable'; exit 1; }
          test -n "$UPDATER_PUBLIC_KEY" || { echo 'Missing MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY repository variable'; exit 1; }
          test -n "$UPDATER_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret'; exit 1; }
          test -n "$UPDATER_PRIVATE_KEY_PASSWORD" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret'; exit 1; }
          printf '%s' "$UPDATER_PUBLIC_KEY" | base64 --decode | grep -q '^untrusted comment: minisign public key:' || {
            echo 'MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY is not a complete Tauri updater public key'
            exit 1
          }
          CONFIG_PUBLIC_KEY="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          test "$UPDATER_PUBLIC_KEY" = "$CONFIG_PUBLIC_KEY" || {
            echo 'The repository updater key does not match src-tauri/tauri.conf.json'
            exit 1
          }
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(awk -F'\"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || { echo 'The release tag does not match package.json'; exit 1; }
          test "$TAG_VERSION" = "$TAURI_VERSION" || { echo 'The release tag does not match tauri.conf.json'; exit 1; }
          test "$TAG_VERSION" = "$CARGO_VERSION" || { echo 'The release tag does not match Cargo.toml'; exit 1; }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID: ${{ vars.MYBREWFOLIO_SYNC_OAUTH_CLIENT_ID }}
          MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY: ${{ vars.MYBREWFOLIO_SYNC_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'MyBrewFolio Sync __VERSION__'
          releaseBody: 'MyBrewFolio Sync Alpha. Review the generated installers and signatures before publishing this draft.'
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}
      - name: Upload stable user-facing download aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ matrix.os }}" in
            macos-latest)
              cp "src-tauri/target/universal-apple-darwin/release/bundle/dmg/MyBrewFolio Sync_${GITHUB_REF_NAME#v}_universal.dmg" \
                "MyBrewFolio-Sync-macOS-universal.dmg"
              gh release upload "$GITHUB_REF_NAME" "MyBrewFolio-Sync-macOS-universal.dmg" --clobber
              ;;
            windows-latest)
              cp "src-tauri/target/release/bundle/msi/MyBrewFolio Sync_${GITHUB_REF_NAME#v}_x64_en-US.msi" \
                "MyBrewFolio-Sync-Windows-x64.msi"
              gh release upload "$GITHUB_REF_NAME" "MyBrewFolio-Sync-Windows-x64.msi" --clobber
              ;;
            ubuntu-22.04)
              cp "src-tauri/target/release/bundle/appimage/MyBrewFolio Sync_${GITHUB_REF_NAME#v}_amd64.AppImage" \
                "MyBrewFolio-Sync-Linux-x86_64.AppImage"
              cp "src-tauri/target/release/bundle/deb/MyBrewFolio Sync_${GITHUB_REF_NAME#v}_amd64.deb" \
                "MyBrewFolio-Sync-Linux-amd64.deb"
              gh release upload "$GITHUB_REF_NAME" \
                "MyBrewFolio-Sync-Linux-x86_64.AppImage" \
                "MyBrewFolio-Sync-Linux-amd64.deb" \
                --clobber
              ;;
          esac
