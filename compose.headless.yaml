services:
  sync:
    image: ghcr.io/modsmthng/mybrewfolio-sync:latest
    restart: unless-stopped
    environment:
      MYBREWFOLIO_SYNC_GAGGIMATE_HOST: ${MYBREWFOLIO_SYNC_GAGGIMATE_HOST:-gaggimate.local}
    volumes:
      - sync-data:/data
    healthcheck:
      test: ["CMD", "mybrewfolio-syncd", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sync-data:
